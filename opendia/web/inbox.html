<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OpenDia Inbox</title>
<style>
  :root {
    --bg: #f6f5f1; --panel: #ffffff; --ink: #1d1d1b; --muted: #6b6a64; --line: #e3e1da;
    --accent: #2f5d50; --accent-ink: #ffffff; --danger: #9b2c2c; --chip: #ecebe5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #141413; --panel: #1e1e1c; --ink: #ecebe5; --muted: #9a998f; --line: #2e2e2b;
      --accent: #6fb39e; --accent-ink: #0d1a16; --danger: #e07a7a; --chip: #2a2a27;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 15px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { max-width: 860px; margin: 0 auto; padding: 28px 16px 8px; display: flex;
           align-items: baseline; justify-content: space-between; gap: 12px; }
  h1 { font-size: 20px; margin: 0; letter-spacing: -0.01em; }
  .sub { color: var(--muted); font-size: 13px; }
  main { max-width: 860px; margin: 0 auto; padding: 8px 16px 48px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px;
          padding: 18px; margin: 14px 0; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px;
          color: var(--muted); }
  .chip { background: var(--chip); color: var(--ink); border-radius: 999px; padding: 1px 10px; }
  details { margin: 10px 0 14px; }
  summary { cursor: pointer; color: var(--muted); font-size: 13px; }
  pre.orig { white-space: pre-wrap; font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
             background: var(--bg); border-radius: 6px; padding: 10px; margin: 8px 0 0;
             max-height: 260px; overflow: auto; }
  label { display: block; font-size: 12px; color: var(--muted); margin: 10px 0 4px; }
  input, textarea { width: 100%; font: inherit; color: var(--ink); background: var(--bg);
                    border: 1px solid var(--line); border-radius: 6px; padding: 8px 10px; }
  textarea { min-height: 150px; resize: vertical; }
  .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  button { font: inherit; border-radius: 6px; padding: 8px 16px; cursor: pointer;
           border: 1px solid var(--line); background: var(--panel); color: var(--ink); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.reject { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }
  .toast { color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div><h1>Approval inbox</h1><div class="sub">Nothing is sent until a person approves it.</div></div>
  <div class="sub" id="count"></div>
</header>
<main id="list"><div class="empty">Loading…</div></main>
<script>
const list = document.getElementById("list");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let editing = false;

async function load() {
  if (editing) return;              // don't clobber a draft someone is typing in
  const rows = await (await fetch("/api/approvals")).json();
  document.getElementById("count").textContent = rows.length ? `${rows.length} waiting` : "";
  if (!rows.length) { list.innerHTML = '<div class="empty">Nothing waiting for approval.</div>'; return; }
  list.innerHTML = rows.map(a => {
    const e = a.context.email, c = a.context.classification, d = a.proposal;
    return `<section class="card" data-id="${esc(a.id)}">
      <div class="meta"><strong style="color:var(--ink)">${esc(e.subject)}</strong>
        <span>from ${esc(e.sender)}</span><span class="chip">${esc(c.category)}</span>
        <span class="chip">${esc(c.priority)}</span></div>
      <div class="sub">${esc(c.rationale)}</div>
      <details><summary>Original message</summary><pre class="orig">${esc(e.body)}</pre></details>
      <label>To</label><input name="to" value="${esc(d.to)}">
      <label>Subject</label><input name="subject" value="${esc(d.subject)}">
      <label>Reply</label><textarea name="body">${esc(d.body)}</textarea>
      <div class="actions">
        <button class="primary" data-act="edit">Approve and send</button>
        <button class="reject" data-act="reject">Reject</button>
        <span class="toast"></span>
      </div></section>`;
  }).join("");
}

list.addEventListener("focusin", () => editing = true);
list.addEventListener("focusout", () => setTimeout(() => editing = list.contains(document.activeElement), 0));
list.addEventListener("click", async ev => {
  const b = ev.target.closest("button[data-act]"); if (!b) return;
  const card = b.closest(".card"), toast = card.querySelector(".toast");
  const val = n => card.querySelector(`[name=${n}]`).value;
  card.querySelectorAll("button").forEach(x => x.disabled = true);
  const body = b.dataset.act === "reject" ? {action: "reject"}
             : {action: "edit", to: val("to"), subject: val("subject"), body: val("body")};
  const r = await fetch(`/api/approvals/${encodeURIComponent(card.dataset.id)}`,
    {method: "POST", headers: {"Content-Type": "application/json"}, body: JSON.stringify(body)});
  toast.textContent = r.ok ? (body.action === "reject" ? "Rejected." : "Approved. Sending once.")
                           : `Not recorded: ${(await r.json()).detail}`;
  editing = false; setTimeout(load, 900);
});
load(); setInterval(load, 4000);
</script>
</body>
</html>
