[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "opendia"
version = "0.1.0.dev0"
description = "Deterministic, self-hosted workflow orchestration for business operations, with a human approval inbox and exactly-once side effects."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
requires-python = ">=3.11"
authors = [{ name = "Linnflux, Inc." }]
keywords = ["workflow", "orchestration", "durable-execution", "llm", "human-in-the-loop", "approvals"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Office/Business",
]
dependencies = [
  "dbos>=3.2,<4",
  "pydantic>=2.6",
  "sqlalchemy>=2.0",
  "httpx>=0.27",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.40"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
opendia = "opendia.cli:main"

[project.urls]
Homepage = "https://github.com/linnflux/OpenDia"

[tool.hatch.build.targets.wheel]
packages = ["opendia"]

[tool.hatch.build.targets.wheel.force-include]
"examples/fixtures" = "opendia/_fixtures"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
